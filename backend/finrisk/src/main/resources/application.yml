server:
  port: 8081

spring:
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/fin_risk_db?useSSL=false&serverTimezone=UTC
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  
  jpa:
    hibernate:
      ddl-auto: update 
    show-sql: true 
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect
        jdbc:
          batch_size: 50
          fetch_size: 50
          batch_versioned_data: true
        order_inserts: true
        order_updates: true

  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}

  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

twilio:
  account:
    sid: ${TWILIO_ACCOUNT_SID}
  auth:
    token: ${TWILIO_AUTH_TOKEN}
  phone:
    number: ${TWILIO_PHONE_NUMBER}

app:
  cors:
    allowed-origins: "${CORS_ALLOWED_ORIGINS:http://localhost:5173}"
  emotion:
    override:
      enabled: ${EMOTION_OVERRIDE_ENABLED:false}
      emotion: ${EMOTION_OVERRIDE_VALUE:FEAR}
      confidence: ${EMOTION_OVERRIDE_CONFIDENCE:0.90}
jwt:
  secret: "${JWT_SECRET}"
  expiration: 600000
  refreshExpiration: 604800000
  
resilience4j:
  circuitbreaker:
    instances:
      faceAiService:
        sliding-window-type: COUNT_BASED
        sliding-window-size: 5
        failure-rate-threshold: 60
        wait-duration-in-open-state: 30s
        permitted-number-of-calls-in-half-open-state: 2
        automatic-transition-from-open-to-half-open-enabled: true
      emotionAiService:
        sliding-window-type: COUNT_BASED
        sliding-window-size: 5
        failure-rate-threshold: 60
        wait-duration-in-open-state: 30s
        permitted-number-of-calls-in-half-open-state: 2
        automatic-transition-from-open-to-half-open-enabled: true
      voiceAiService:
        sliding-window-type: COUNT_BASED
        sliding-window-size: 5
        failure-rate-threshold: 60
        wait-duration-in-open-state: 30s
        permitted-number-of-calls-in-half-open-state: 2
        automatic-transition-from-open-to-half-open-enabled: true

ai:
  service:
    face-url: http://localhost:5000/api/ai/verify-face
    emotion-url: http://localhost:5001/api/ai/detect-emotion
    emotion-sequence-url: http://localhost:5001/api/ai/detect-emotion-sequence
    voice-url: http://localhost:5003/api/ai/verify-voice
  timeout:
    connect-ms: 3000
    read-ms: 10000
    parallel-seconds: 13

logging:
  level:
    "[com.datn.finrisk]": DEBUG
    "[org.hibernate.SQL]": WARN
    "[org.hibernate.type.descriptor.sql]": WARN
  file:
    name: logs/finrisk-debug.log
  logback:
    rollingpolicy:
      max-file-size: 20MB
      max-history: 5
  pattern:
    file: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level [txId=%X{txId}] [corrId=%X{correlationId}] %logger{36} - %msg%n"

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: alpha # Sắp xếp API trong cụm theo bảng chữ cái
    tags-sorter: alpha       # Sắp xếp các nhóm Controller theo chữ cái
  api-docs:
    path: /api-docs
  packages-to-scan: com.datn.finrisk.web.controllers # Quét đúng túi controller của bro